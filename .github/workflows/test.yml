name: Test workflow

jobs:
  get-oidc-token:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Get OIDC ID Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'uri:telerik-support-service';
            const idToken = await core.getIDToken(audience);
            console.log(idToken)
name: Test workflow
on:
  workflow_dispatch:

jobs:
  get-oidc-token:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Get OIDC ID Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audience = 'uri:telerik-support-service';
            const idToken = await core.getIDToken(audience);
            fs.writeFileSync('id-token.txt', idToken);
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: token
          path: id-token.txt
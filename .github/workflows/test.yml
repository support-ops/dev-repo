name: Test workflow
on:
  workflow_dispatch:

jobs:
  get-oidc-token:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Fetch OIDC Token with curl
        run: |
          # 2. Optional: Append &audience=... to customize the 'aud' claim
          AUDIENCE="uri:telerik-support-service"
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          # 3. Extract the JWT from the JSON response using jq
          ID_TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          echo "$ID_TOKEN"